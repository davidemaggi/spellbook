<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="spellbook: portable skills for every AI agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0-10 L2-2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2-2Z" fill="#fef3c7"/>
    </symbol>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="80" cy="60" r="1.6"/><circle cx="190" cy="250" r="1.2"/><circle cx="320" cy="40" r="1.4"/>
    <circle cx="560" cy="280" r="1.2"/><circle cx="700" cy="30" r="1.6"/><circle cx="860" cy="270" r="1.3"/>
    <circle cx="1010" cy="50" r="1.5"/><circle cx="1130" cy="230" r="1.2"/><circle cx="1150" cy="110" r="1"/>
    <circle cx="40" cy="190" r="1"/><circle cx="470" cy="70" r="1"/><circle cx="960" cy="160" r="1"/>
  </g>
  <use href="#spark" x="1040" y="70" width="26" height="26" opacity="0.9"/>
  <use href="#spark" x="125" y="215" width="18" height="18" opacity="0.8"/>
  <use href="#spark" x="760" y="250" width="14" height="14" opacity="0.7"/>

  <!-- open book -->
  <g transform="translate(150 95)">
    <ellipse cx="85" cy="70" rx="120" ry="90" fill="url(#glow)"/>
    <path d="M85 40 C60 22 25 20 0 28 L0 128 C25 120 60 122 85 140 Z" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/>
    <path d="M85 40 C110 22 145 20 170 28 L170 128 C145 120 110 122 85 140 Z" fill="#fffbeb" stroke="#fbbf24" stroke-width="3"/>
    <g stroke="#c4b5fd" stroke-width="3" stroke-linecap="round">
      <path d="M18 52 Q45 46 70 56"/><path d="M18 72 Q45 66 70 76"/><path d="M18 92 Q40 87 60 94"/>
      <path d="M100 56 Q125 46 152 52"/><path d="M100 76 Q125 66 152 72"/><path d="M110 94 Q130 87 152 92"/>
    </g>
    <use href="#spark" x="60" y="-30" width="22" height="22"/>
    <use href="#spark" x="98" y="-14" width="14" height="14"/>
  </g>

  <text x="400" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="url(#title)">spellbook</text>
  <text x="404" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" fill="#ede9fe">Portable skills for every AI agent</text>
</svg>
